name: Publish Gradle perf report

on:
  push:
    branches: [main]
    paths:
      - "gradle-perf/site/**"
      - ".github/workflows/gradle-perf-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gradle-perf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: gradle-perf/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
